server:
  port: 8080

spring:
  config:
    import: optional:file:.env.properties
  application:
    name: echo-backend
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/echo}
    auto-index-creation: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET_HERE}
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.echo: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

echo:
  jwt:
    secret: ${JWT_SECRET:echoSecretKey256BitLongEnoughForHS256AlgorithmPleaseChangeInProduction}
    expiry-ms: ${JWT_EXPIRY_MS:604800000}
  encryption:
    key: ${ENCRYPTION_KEY:EchoAES256KeyMustBe32Characters!}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  media:
    storage:
      type: ${MEDIA_STORAGE_TYPE:cloudinary}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME_HERE}
    api-key: ${CLOUDINARY_API_KEY:YOUR_API_KEY_HERE}
    api-secret: ${CLOUDINARY_API_SECRET:YOUR_API_SECRET_HERE}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
